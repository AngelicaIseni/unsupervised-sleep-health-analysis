<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Sleep, Stress and Occupation — Unsupervised clustering and Bayesian network analysis</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101025"/>
      <stop offset="100%" stop-color="#1a1245"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg2)"/>

  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- scattered stars -->
  <g fill="#f4f1ea" opacity="0.5">
    <circle cx="640" cy="35" r="1.5"/>
    <circle cx="700" cy="60" r="1"/>
    <circle cx="900" cy="30" r="1.5"/>
    <circle cx="1000" cy="55" r="1"/>
    <circle cx="1100" cy="35" r="1.5"/>
    <circle cx="760" cy="25" r="1"/>
  </g>

  <!-- crescent moon -->
  <g transform="translate(660,60)">
    <circle cx="0" cy="0" r="16" fill="#f2d98a"/>
    <circle cx="7" cy="-5" r="14" fill="#101025"/>
  </g>

  <!-- title block -->
  <text x="70" y="105" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#f4f1ea">
    Sleep, Stress &amp; Occupation
  </text>
  <text x="70" y="145" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#b8b3e0">
    Unsupervised clustering + Bayesian network analysis
  </text>
  <text x="70" y="172" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#b8b3e0">
    of the Sleep Health and Lifestyle dataset
  </text>

  <g font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500">
    <rect x="70" y="205" width="140" height="28" rx="14" fill="#7f77dd33" stroke="#7f77dd" stroke-width="1"/>
    <text x="140" y="224" text-anchor="middle" fill="#cdc9f5">scikit-learn</text>

    <rect x="222" y="205" width="98" height="28" rx="14" fill="#1d9e7533" stroke="#1d9e75" stroke-width="1"/>
    <text x="271" y="224" text-anchor="middle" fill="#8fe0c4">pgmpy</text>

    <rect x="332" y="205" width="106" height="28" rx="14" fill="#d85a3033" stroke="#d85a30" stroke-width="1"/>
    <text x="385" y="224" text-anchor="middle" fill="#f3b294">DBSCAN</text>

    <rect x="450" y="205" width="168" height="28" rx="14" fill="#37bee833" stroke="#37bee8" stroke-width="1"/>
    <text x="534" y="224" text-anchor="middle" fill="#9fe4f5">Bayesian networks</text>
  </g>

  <!-- right-side illustration: clustered dots morphing into a small DAG -->
  <g transform="translate(760,0)">
    <!-- cluster 1 -->
    <g fill="#7f77dd">
      <circle cx="35" cy="70" r="6"/>
      <circle cx="55" cy="55" r="6"/>
      <circle cx="50" cy="90" r="6"/>
      <circle cx="20" cy="95" r="6"/>
    </g>
    <!-- cluster 2 -->
    <g fill="#1d9e75">
      <circle cx="40" cy="170" r="6"/>
      <circle cx="65" cy="185" r="6"/>
      <circle cx="30" cy="200" r="6"/>
      <circle cx="60" cy="150" r="6"/>
    </g>
    <!-- cluster 3 -->
    <g fill="#d85a30">
      <circle cx="130" cy="120" r="6"/>
      <circle cx="150" cy="140" r="6"/>
      <circle cx="115" cy="145" r="6"/>
    </g>

    <!-- arrow into DAG -->
    <line x1="185" y1="130" x2="225" y2="130" stroke="#f4f1ea" stroke-width="1.5" opacity="0.6"/>
    <polygon points="225,123 238,130 225,137" fill="#f4f1ea" opacity="0.6"/>

    <!-- small DAG (Bayesian network) -->
    <g stroke="#f4f1ea" stroke-width="1.2" opacity="0.55">
      <line x1="290" y1="70"  x2="340" y2="130"/>
      <line x1="290" y1="190" x2="340" y2="130"/>
      <line x1="340" y1="130" x2="410" y2="90"/>
      <line x1="340" y1="130" x2="410" y2="170"/>
      <line x1="410" y1="90"  x2="410" y2="170"/>
    </g>
    <g>
      <circle cx="290" cy="70"  r="9" fill="#37bee8"/>
      <circle cx="290" cy="190" r="9" fill="#37bee8"/>
      <circle cx="340" cy="130" r="10" fill="#f2a65a"/>
      <circle cx="410" cy="90"  r="9" fill="#37bee8"/>
      <circle cx="410" cy="170" r="9" fill="#d4537e"/>
    </g>
  </g>
</svg>
